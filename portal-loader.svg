<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -200 400 400" style="background:#1a1a1a" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- 4 circles spiral in and take their colors (0-0.9s), center disc fades in, star + glow pop at 0.9s and settle by 2s -->
<defs>
<filter id="g" x="-2" y="-2" width="5" height="5">
<feDropShadow dx="0" dy="0" stdDeviation="0" flood-color="#fff"><animate attributeName="stdDeviation" values="0;20;0" keyTimes="0;.091;1" calcMode="spline" keySplines="0 0 1 1;.333 1 .667 1" begin="0.9s" dur="1.1s"/><animate attributeName="flood-opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines=".333 0 .667 .333" begin="0.9s" dur="0.1s"/></feDropShadow>
<feDropShadow dx="0" dy="0" stdDeviation="40" flood-color="#fff" flood-opacity="0"><animate attributeName="flood-opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines=".333 0 .667 .333" begin="0.9s" dur="0.1s"/></feDropShadow>
</filter>
<g id="o" opacity="0">
<circle r="33.6" fill="#2a2a2a"/>
<circle r="33.6" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.215 1 .359 1" dur="0.9s" fill="freeze"/></circle>
<animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.765s" fill="freeze"/>
<animateMotion path="M106.1 106.1C128.3 83.9 139.6 51.7 137.8 21.8 136-8 121.6-35 102.1-52 82.6-69 58.8-76.2 38.5-75.6 18.3-75.1 2-67.5-9.4-59.2-20.8-50.9-27.7-42.3-35-35" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.215 1 .359 1" dur="0.9s" fill="freeze"/>
</g>
</defs>
<use href="#o" fill="#F5C542"/>
<use href="#o" fill="#F5A3C7" transform="rotate(90)"/>
<use href="#o" fill="#7DD3E8" transform="rotate(180)"/>
<use href="#o" fill="#A3E048" transform="rotate(270)"/>
<circle r="35" fill="#2a2a2a" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines=".333 0 .667 0" dur="0.9s" fill="freeze"/></circle>
<path d="M0-35A35 35 0 0 0 35 0 35 35 0 0 0 0 35 35 35 0 0 0-35 0 35 35 0 0 0 0-35z" fill="#fff" opacity="0" filter="url(#g)"><animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.1s" fill="freeze"/></path>
</svg>
